  if (i > 0) {
    const base = (i - 1) * 2;
    indices.push(base, base+1, base+2, base+1, base+3, base+2);
  }
}
ribbonGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
ribbonGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
ribbonGeo.setIndex(indices);
ribbonGeo.computeVertexNormals();

const ribbonMat = new THREE.MeshBasicMaterial({
  vertexColors: true, side: THREE.DoubleSide, transparent: true, opacity: 0.92
});
const ribbon = new THREE.Mesh(ribbonGeo, ribbonMat);
world.add(ribbon);

const underGeo = ribbonGeo.clone();
const underMat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide, transparent: true, opacity: 0.14 });
const underRibbon = new THREE.Mesh(underGeo, underMat);
underRibbon.scale.set(1, 1, 1);
underRibbon.position.y = -0.3;
world.add(underRibbon);

const trailGeo = new THREE.BufferGeometry().setFromPoints(curvePts);
const trailMat = new THREE.LineBasicMaterial({ color: GOLD, transparent: true, opacity: 0.25 });
world.add(new THREE.Line(trailGeo, trailMat));

const pw = DATA.particle_weights;
const maxW = Math.max(...pw.map(Math.abs));
const particles = [];
const glowTex = glowTexture(0xffffff);

pw.forEach((w, i) => {
  const isLong = w >= 0;
  const color = isLong ? TEAL : CORAL;
  const mag = Math.abs(w) / maxW;
  const spriteMat = new THREE.SpriteMaterial({
    map: glowTex, color, transparent: true, opacity: 0.85 + 0.15*mag,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const sprite = new THREE.Sprite(spriteMat);
  const size = 1.0 + mag * 3.2;
  sprite.scale.set(size, size, 1);

  const radius = 9 + (i % 6) * 2.4;
  const speed = 0.05 + (i % 5) * 0.018;
  const phase = (i / pw.length) * Math.PI * 2;
  const yOff = -6 + (i % 7) * 2.1;
  const tilt = (i % 3) * 0.35;

  particles.push({ sprite, radius, speed, phase, yOff, tilt });
  world.add(sprite);

  const core = new THREE.Mesh(
    new THREE.SphereGeometry(0.16 + mag*0.22, 12, 12),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 })
  );
  particles[particles.length-1].core = core;
  world.add(core);
});

function makeStars(count, spread, size, color, opacity) {
  const geo = new THREE.BufferGeometry();
  const pos = [];
  for (let i = 0; i < count; i++) {
    pos.push((Math.random()-0.5)*spread, (Math.random()-0.5)*spread*0.6, (Math.random()-0.5)*spread);
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color, size, transparent: true, opacity, sizeAttenuation: true });
  return new THREE.Points(geo, mat);
}
const starsFar = makeStars(500, 220, 0.5, 0x8891ab, 0.5);
const starsNear = makeStars(150, 120, 0.9, DIM, 0.6);
scene.add(starsFar, starsNear);

let t0 = performance.now();
let worldRotY = 0.28, worldRotX = -0.12;

function animate() {
  requestAnimationFrame(animate);
  const t = (performance.now() - t0) / 1000;

  world.rotation.y = worldRotY + t * 0.09;
  world.rotation.x = worldRotX + Math.sin(t * 0.08) * 0.08;
  world.position.y = Math.sin(t * 0.22) * 0.6;

  particles.forEach(p => {
    const ang = p.phase + t * p.speed;
    const x = Math.cos(ang) * p.radius;
    const z = Math.sin(ang) * p.radius + Math.sin(t*0.3+p.phase)*1.5;
    const y = p.yOff + Math.sin(t * 0.6 + p.phase) * 1.2;
    p.sprite.position.set(x, y, z);
    p.core.position.set(x, y, z);
    const pulse = 1 + Math.sin(t * 1.6 + p.phase) * 0.12;
    p.sprite.scale.set(p.sprite.scale.x, p.sprite.scale.x, 1);
    p.core.scale.setScalar(pulse);
  });

  starsFar.rotation.y = t * 0.01;
  starsNear.rotation.y = -t * 0.015;

  camera.position.x = Math.sin(t * 0.05) * 3;
  camera.lookAt(0, 1, 0);

  renderer.render(scene, camera);
}
animate();

setTimeout(() => {
  document.getElementById('overlay').style.opacity = 1;
  document.getElementById('title').style.opacity = 1;
}, 900);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
